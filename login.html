<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Login - Kridiya Travel and Tourism</title>
<meta name="description" content="Log in to your Kridiya Travel account to view your enquiries and manage your profile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="canonical" href="https://www.kridiyatravel.com/login.html">
<link rel="stylesheet" href="css/styles.css?v=20260921social-outline">
<link rel="stylesheet" href="css/motion.css?v=20260921social-outline">
<link rel="stylesheet" href="css/kridiya-brand-kit/index.css?v=20260921complete2">
</head>
<body data-page="login">
<header id="site-header" class="site-header"></header>
<main>
  <div class="container auth-wrap">
    <div class="auth-shell">
      <section class="auth-card auth-card--login">
        <h1>Sign in</h1>
        <form id="login-form" class="form-grid" novalidate>
          <div class="form-banner error" hidden role="alert"></div>
          <div class="field">
            <label for="lg-email">EMAIL</label>
            <input id="lg-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="lg-pass">PASSWORD</label>
            <div class="pw-wrap">
              <input id="lg-pass" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
              <button type="button" class="pw-toggle" aria-label="Show password">SHOW</button>
            </div>
          </div>
          <div class="auth-form-row auth-form-row--end">
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" data-label="Log in">Log in</button>
        </form>
        <div class="auth-actions" aria-label="Other account options">
          <a href="register.html">Create account</a>
          <a href="track-enquiry.html">Track an enquiry</a>
        </div>
      </section>
    </div>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="js/motion.js?v=20260921complete2" defer></script>
<script src="js/motion-controls.js?v=20260921complete2" defer></script>
<script src="js/main.js?v=20260921complete2" defer></script>
<script src="js/auth.js?v=20260921complete2" defer></script>
</body>
</html>
